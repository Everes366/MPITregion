{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col">
            {% if success %}
            <div class="alert alert-success rt-alert border-0 shadow-sm mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-danger rt-alert border-0 shadow-sm mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
            </div>
            {% endif %}
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-xl-9 col-lg-10 col-md-11">
            {% if user %}
            <div class="card profile-card theme-card rt-profile-card border-0 shadow">
                <div class="card-header rt-header text-white p-3">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-person-circle fs-3 me-3 text-white-25"></i>
                        <div class="flex-grow-1">
                            <h5 class="mb-1 fw-bold">Профиль пользователя</h5>
                            <h6 class="mb-0 opacity-90">{{ user.fullname }}</h6>
                            <small class="opacity-75">{{ user.login }}</small>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form method="post">
                        <div class="row g-3">
                            <div class="col-lg-6 col-md-12">
                                <label class="form-label rt-label fw-semibold mb-2">
                                    <i class="bi bi-person-badge me-1"></i>Полное имя
                                </label>
                                <input type="text"
                                       name="fullname"
                                       class="form-control rt-input"
                                       value="{{ user.fullname }}"
                                       placeholder="ФИО"
                                />
                            </div>

                            <div class="col-lg-6 col-md-12">
                                <label class="form-label rt-label fw-semibold mb-2">
                                    <i class="bi bi-person-lines-fill me-1"></i>Логин
                                </label>
                                <input type="text"
                                       name="login"
                                       class="form-control rt-input-readonly"
                                       value="{{ user.login }}"
                                       readonly
                                />
                            </div>
                        </div>

                        <div class="row g-3 mt-3">
                            <div class="col-lg-6 col-md-12">
                                <label class="form-label rt-label fw-semibold mb-2">
                                    <i class="bi bi-lock-fill me-1"></i>Новый пароль
                                </label>
                                <input type="password"
                                       name="password"
                                       class="form-control rt-input"
                                       placeholder="Пароль"
                                />
                            </div>
                            <div class="col-lg-6 col-md-12">
                                <label class="form-label rt-label fw-semibold mb-2">
                                    <i class="bi bi-lock-fill me-1"></i>Подтверждение
                                </label>
                                <input type="password"
                                       name="password1"
                                       class="form-control rt-input"
                                       placeholder="Повторите"
                                />
                            </div>
                        </div>

                        <div class="d-flex gap-3 justify-content-end mt-4 pt-3 border-top">
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary rt-btn px-4">
                                <i class="bi bi-arrow-left me-1"></i>Главная
                            </a>
                            <button type="submit" class="btn btn-primary rt-btn px-5">
                                <i class="bi bi-save me-1"></i>Сохранить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            {% else %}
            <div class="alert alert-warning">Пользователь не найден.</div>
            {% endif %}
        </div>
    </div>
</div>

<style>
/* Компактный широкий Ростелеком профиль */
:root {
    --rt-primary: #0052CC;
    --rt-primary-dark: #003D99;
}

.rt-alert {
    border-radius: 10px;
    border-left: 4px solid var(--rt-primary);
}

.rt-profile-card {
    border-radius: 16px;
    overflow: hidden;
}

.rt-header {
    background: linear-gradient(135deg, var(--rt-primary), var(--rt-primary-dark));
    border: none;
    padding: 1.5rem 2rem;
}

.rt-label {
    color: var(--rt-primary);
    font-size: 0.9rem;
}

.rt-input, .rt-input-readonly {
    border: 2px solid #E3F2FD;
    border-radius: 10px;
    padding: 0.875rem 1.25rem;
    background: #FAFDFF;
    transition: all 0.3s ease;
    font-size: 0.98rem;
}

.rt-input:focus, .rt-input-readonly:focus {
    border-color: var(--rt-primary);
    box-shadow: 0 0 0 0.2rem rgba(0,82,204,0.08);
}

.rt-input-readonly {
    background: #F8FAFC;
    color: #64748B;
}

.rt-btn {
    border-radius: 10px;
    padding: 0.75rem 1.5rem;
    font-weight: 500;
    border: none;
    transition: all 0.3s ease;
}

.btn-primary.rt-btn {
    background: linear-gradient(135deg, var(--rt-primary), var(--rt-primary-dark));
}

.btn-primary.rt-btn:hover {
    transform: translateY(-1px);
}

.btn-outline-secondary.rt-btn {
    border: 2px solid #D1D5DB;
}

.btn-outline-secondary.rt-btn:hover {
    background: var(--rt-primary);
    color: white;
    border-color: var(--rt-primary);
}

.container { 
    background: linear-gradient(to bottom, #F8F9FA 0%, #E9ECEF 100%); 
    min-height: 100vh;
}

.card-body { padding: 2rem 1.75rem !important; }
</style>
{% endblock %}
