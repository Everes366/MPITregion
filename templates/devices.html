{% extends 'base.html' %}

{% block content %}
<div class = "container">
    <div class="row">
        <div class="col">
            {% if success %}
            <div class="alert alert-success" role="alert">
                {{ success }}
            </div>
            {% endif %}
            {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
            {% endif %}
        </div>
    </div>
    <div class="row">
        {% for device in devices %}
        <div class="col-2">
            <div class="card">
                <img src={% if device.file %}"{{ url_for('static', filename='img/'+device.file) }}"{% else %}"{{ url_for('static', filename='img/noimg.jpg') }}"{% endif %} class="img-fluid card-img-top d-block mx-auto" width="250" height="250">
                <div class="card-body">
                    <h5>{{ device.name }}</h5>
                    <p class="card-text">
                        Тип устройства {{ device.type }}
                    </p>
                    {% if current_user.is_authenticated %}
                    <form action="{{ url_for('include_device', user_id=current_user.id, device_id=device.id) }}" method="post"><button type="submit" class="btn btn-primary w-100">Добавить</button></form>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
