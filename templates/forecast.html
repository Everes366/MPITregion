{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
  <!-- Уведомления в стиле Ростелекома -->
  <div class="row row-cols-1 row-cols-md-4 g-4">
    <div class="col">
      {% if success %}
        <div class="alert alert-success border-0 rounded-3 shadow-sm mb-4 d-flex align-items-center" style="background: #f0f9f0; border-left: 6px solid #0052cc;" role="alert">
          <i class="bi bi-check-circle-fill me-2 text-primary"></i>
          <span class="fw-medium">{{ success }}</span>
        </div>
      {% endif %}

      {% if error %}
        <div class="alert alert-danger border-0 rounded-3 shadow-sm mb-4 d-flex align-items-center" style="background: #fff0f0; border-left: 6px solid #e00000;" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
          <span class="fw-medium">{{ error }}</span>
        </div>
      {% endif %}
    </div>
  </div>

  <!-- Блок таблицы прогноза — вытянутая по ширине -->
  <div class="row row-cols-1 row-cols-md-4 g-4">
    <div class="col">
      <div class="card border-0 shadow-sm rounded-4" style="background: #ffffff; overflow: hidden;">
        <div class="card-body p-3">

          <!-- Заголовок в стиле Ростекома -->
          <div class="d-flex align-items-center mb-3">
            <i class="bi bi-graph-up me-2 text-primary"></i>
            <h6 class="mb-0 text-dark fs-6 fw-medium">Прогноз показаний</h6>
          </div>

          <table class="table table-striped table-sm mb-0 w-100">
            <thead class="table-light">
              <tr>
                <th class="text-muted text-center">#</th>
                <th class="text-muted">Дата</th>
                <th class="text-muted text-end">Прогнозное значение</th>
              </tr>
            </thead>
            <tbody>
              {% for item in forecast %}
                <tr>
                  <td class="text-center fw-medium">{{ loop.index }}</td>
                  <td>{{ item.0 }}</td>
                  <td class="text-end fw-medium text-primary">{{ item.1 }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
