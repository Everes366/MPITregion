{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-7 col-md-9">
                <div class="card-rt p-4 shadow">
                    <h5 class="mb-4">Добавить устройство</h5>

                    <form method="post">
                        <input type="hidden" name="type" value="{{ device_type }}">

                        <div class="mb-3">
                            <label class="form-label">Имя устройства</label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Например: Гостиная лампа"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Тип устройства</label>
                            <input type="text"
                                   class="form-control"
                                   value="{{ device_type }}"
                                   readonly>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{{ url_for('vacuum_control') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Назад
                            </a>
                            <button type="submit" class="btn btn-rt">
                                <i class="bi bi-save me-1"></i>Сохранить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
